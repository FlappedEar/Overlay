name: Native CI

# Cloud CI resumed by owner on 2026-09-13; Windows remains paused.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.event.pull_request.number || github.ref }}
  # KAN-154: a newer push supersedes a pull request run, but every main
  # revision keeps its completed run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: ${{ matrix.name }} / ${{ matrix.build-type }} / Qt 6.8.3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
        # Owner direction, 2026-09-13: pause Windows until explicitly resumed.
        platform: [macos]
        include:
          - platform: macos
            name: macOS arm64
            os: macos-15
            qt-arch: clang_64
            graphics-api: metal
            software-renderer: '0'
    defaults:
      run:
        shell: pwsh
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      QT_QPA_PLATFORM: offscreen
      # Windows GUI executables otherwise route Qt and Qt Test messages to
      # OutputDebugString, which CTest cannot capture for smoke assertions.
      QT_FORCE_STDERR_LOGGING: '1'
      # Offscreen QPA otherwise falls back to the software scene-graph
      # adaptation even when QSG_RHI_BACKEND selects a graphics API.
      QT_QUICK_BACKEND: rhi
      QT_QUICK_CONTROLS_STYLE: Basic
      QSG_RENDER_LOOP: basic
      QSG_RHI_BACKEND: ${{ matrix.graphics-api }}
      # Windows uses D3D11 WARP. The Qt Quick software/null backends cannot
      # exercise our QRhi readback and pixel assertions.
      QSG_RHI_PREFER_SOFTWARE_RENDERER: ${{ matrix.software-renderer }}
      QSG_INFO: '1'
      QT_SCALE_FACTOR: '1'
      FLAPPEDEAR_SKIP_HARDWARE_TESTS: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Set up MSVC 2022 x64
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
          vsversion: '2022'

      - name: Install Qt 6.8.3 and modules
        # Call the pinned implementation directly; the composite wrapper uses
        # mutable action refs internally. Python is installed explicitly above.
        uses: jurplel/install-qt-action/action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: '6.8.3'
          target: desktop
          arch: ${{ matrix.qt-arch }}
          # SVG ships in the default Qt base archives, not as an aqt add-on.
          modules: qtmultimedia qtshadertools
          cache: true
          cache-key-prefix: native-ci-qt-6.8.3-v1

      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install ffmpeg

      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify toolchain and software codecs
        run: |
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          cmake --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ninja --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:QT_ROOT_DIR/bin/qmake" -query QT_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffmpeg -version | Tee-Object ci-logs/ffmpeg-version.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffprobe -version | Tee-Object ci-logs/ffprobe-version.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $encoders = ffmpeg -hide_banner -encoders 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $encoders | Set-Content ci-logs/ffmpeg-encoders.txt
          foreach ($codec in @('libx264', 'libx265', 'ffv1', 'aac')) {
            if ($encoders -notmatch "\b$codec\b") { throw "FFmpeg is missing required encoder: $codec" }
          }
          $main10 = ffmpeg -hide_banner -h encoder=libx265 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($main10 -notmatch '\byuv420p10le\b') { throw 'libx265 Main10 is required for synthetic integration tests.' }
          $main10 | Set-Content ci-logs/libx265-capabilities.txt

      - name: Configure ${{ matrix.build-type }} build
        run: |
          cmake -S . -B build-native -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DFLAPPEDEAR_DEPLOY_QT=${{ matrix.build-type == 'Release' && 'ON' || 'OFF' }} "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" 2>&1 | Tee-Object ci-logs/configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build application and tests
        run: |
          cmake --build build-native --parallel 2 2>&1 | Tee-Object ci-logs/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Qt Test and startup smoke
        timeout-minutes: 20
        run: |
          ctest --test-dir build-native --build-config ${{ matrix.build-type }} --verbose --output-on-failure --no-tests=error --timeout 900 --output-junit "$env:GITHUB_WORKSPACE/ci-logs/ctest.xml" 2>&1 | Tee-Object ci-logs/ctest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage and smoke-test internal candidate
        if: matrix.build-type == 'Release'
        run: |
          cmake --install build-native --prefix "$env:GITHUB_WORKSPACE/native-dist/stage" --config Release 2>&1 | Tee-Object ci-logs/deploy.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package_candidate.py --stage native-dist/stage --qt-root "$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and validate Windows NSIS installer
        if: runner.os == 'Windows' && matrix.build-type == 'Release'
        run: |
          choco upgrade nsis --version=3.12 --allow-downgrade --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nsis = "${env:ProgramFiles(x86)}/NSIS/makensis.exe"
          & $nsis /VERSION | Tee-Object ci-logs/nsis-version.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build_windows_installer.py --stage native-dist/stage --makensis "$nsis" 2>&1 | Tee-Object ci-logs/nsis-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_windows_installer.py --stage native-dist/stage --qt-root "$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload internal candidate
        if: success() && matrix.build-type == 'Release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ matrix.os }}-${{ github.sha }}
          path: native-dist/artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Record validation scope
        if: always()
        run: |
          @'
          Cloud gate: macOS arm64 only; Windows builds and installer validation are paused by owner direction. Debug and Release application builds, Qt Test suite, production QML startup smoke, QRhi pixel regressions, and synthetic FFmpeg integrations.
          The VideoToolbox hardware test is explicitly skipped; private VBO/GoPro fixtures are not supplied. Platform-specific tests report their own skip reasons in ctest.log.
          Release jobs deploy Qt, hide the build SDK for a relocated startup smoke, and attach an unsigned/internal candidate with file hashes and build metadata. A green run does not establish real-media, hardware-encoder, clean-machine, signing/notarization, or interactive-editor release acceptance.
          '@ | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-ci-${{ matrix.os }}-${{ matrix.build-type }}-qt-6.8.3
          path: |
            ci-logs/
            build-native/Testing/Temporary/
            build-native/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14

  # KAN-154: the GUI-free test programs on Linux with GCC, under AddressSanitizer
  # (including leak checks) and UndefinedBehaviorSanitizer. The editor, its
  # QRhi pixel tests and the FFmpeg export integrations stay on macOS.
  linux-sanitizers:
    name: Linux x64 / ASan+UBSan / Qt 6.8.3
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      QT_QPA_PLATFORM: offscreen
      # A 32 MiB quarantine instead of 256 MiB: freed memory held for
      # use-after-free detection otherwise counts toward the peak-memory
      # budget in boundsVboHeaderAndDecodedValues (562 MiB against 300 alone).
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1:quarantine_size_mb=32
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      # The editor, its startup and the export integrations need a display,
      # a GPU and FFmpeg 8.1; macOS runs them. The boundary checks are scripts.
      EXCLUDED_TESTS: flappedear_native_tests|flappedear_startup_smoke|flappedear_command_line_usage|flappedear_telemetry_core_boundary|flappedear_telemetry_app_boundary
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ninja-build libgl-dev libegl-dev \
            libxkbcommon-dev libvulkan-dev libfontconfig1-dev libfreetype-dev

      - name: Install Qt 6.8.3 and modules
        uses: jurplel/install-qt-action/action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: '6.8.3'
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia qtshadertools
          cache: true
          cache-key-prefix: native-ci-qt-6.8.3-linux-v1

      - name: Configure sanitizer build
        run: |
          set -o pipefail
          mkdir -p ci-logs
          flags='-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined'
          cmake -S . -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR" \
            "-DCMAKE_C_FLAGS=$flags" "-DCMAKE_CXX_FLAGS=$flags" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined" 2>&1 | tee ci-logs/configure.log

      - name: Build the GUI-free test programs
        run: |
          set -o pipefail
          # Each remaining CTest test runs the executable of the same name.
          ctest --test-dir build-native -N | awk '/Test +#/ {print $3}' | grep -vE "^($EXCLUDED_TESTS)\$" > ci-logs/tests.txt
          test -s ci-logs/tests.txt
          cmake --build build-native --target $(cat ci-logs/tests.txt) 2>&1 | tee ci-logs/build.log

      - name: Run them under the sanitizers
        timeout-minutes: 25
        run: |
          set -o pipefail
          ctest --test-dir build-native --output-on-failure --no-tests=error --timeout 900 -j 4 \
            -R "^($(paste -sd'|' ci-logs/tests.txt))\$" --output-junit "$GITHUB_WORKSPACE/ci-logs/ctest.xml" 2>&1 | tee ci-logs/ctest.log

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-ci-linux-sanitizers-qt-6.8.3
          path: |
            ci-logs/
            build-native/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 14

  # KAN-155: a short libFuzzer pass over the VBO, RCZ and GPMF decoders on
  # every push, starting from the seed corpora. Longer runs are manual
  # (docs/testing.md); a crash input is uploaded with the logs.
  linux-fuzz:
    name: Linux x64 / Fuzz parsers / Qt 6.8.3
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ninja-build clang-18 libclang-rt-18-dev \
            libgl-dev libegl-dev libxkbcommon-dev libvulkan-dev libfontconfig1-dev libfreetype-dev

      - name: Install Qt 6.8.3 and modules
        uses: jurplel/install-qt-action/action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: '6.8.3'
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia qtshadertools
          cache: true
          cache-key-prefix: native-ci-qt-6.8.3-linux-v1

      - name: Build the fuzz harnesses
        run: |
          set -o pipefail
          mkdir -p ci-logs
          cmake -S . -B build-fuzz -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR" \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 -DFLAPPEDEAR_BUILD_FUZZERS=ON \
            2>&1 | tee ci-logs/configure.log
          cmake --build build-fuzz --target flappedear_fuzz_vbo flappedear_fuzz_rcz flappedear_fuzz_gpmf \
            2>&1 | tee ci-logs/build.log

      - name: Fuzz each parser for 60 seconds
        run: |
          set -o pipefail
          for format in vbo rcz gpmf; do
            mkdir -p "fuzz-corpus/$format" "ci-logs/crashes-$format"
            cp "native/fuzz/seeds/$format/"* "fuzz-corpus/$format/"
            "build-fuzz/native/fuzz/flappedear_fuzz_$format" "fuzz-corpus/$format" \
              -max_total_time=60 -max_len=65536 -timeout=30 -rss_limit_mb=2560 \
              "-artifact_prefix=ci-logs/crashes-$format/" 2>&1 | tee "ci-logs/fuzz-$format.log" | tail -n 60
          done

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-ci-linux-fuzz-qt-6.8.3
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14
