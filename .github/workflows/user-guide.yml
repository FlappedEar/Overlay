name: User Guide

# Builds the static user guide in docs/user-guide and publishes it to GitHub
# Pages from main. Pull requests only build and validate links.
# One-time repository setting: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - 'docs/user-guide/**'
      - '.github/workflows/user-guide.yml'
  pull_request:
    paths:
      - 'docs/user-guide/**'
      - '.github/workflows/user-guide.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: user-guide-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build user guide
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and validate links
        run: python3 docs/user-guide/build.py "$RUNNER_TEMP/user-guide"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/user-guide

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
